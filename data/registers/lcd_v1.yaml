block/LCD:
  description: LCD controller.
  items:
  - name: CR0
    description: Configuration register 0.
    byte_offset: 0
    fieldset: CR0
  - name: CR1
    description: Configuration register 1.
    byte_offset: 4
    fieldset: CR1
  - name: INTCLR
    description: Interrupt clear register.
    byte_offset: 8
    fieldset: INTCLR
  - name: POEN0
    description: Output configuration register 0.
    byte_offset: 12
    fieldset: POEN0
  - name: POEN1
    description: Output configuration register 1.
    byte_offset: 16
    fieldset: POEN1
  - name: RAM
    description: Display RAM 0-7, full 32 bits.
    array:
      len: 8
      stride: 4
    byte_offset: 20
    fieldset: RAM
  - name: RAM8
    description: Display RAM 8-15, only the low 8 bits are implemented.
    array:
      len: 8
      stride: 4
    byte_offset: 52
    fieldset: RAM8
fieldset/CR0:
  description: Configuration register 0.
  fields:
  - name: EN
    description: LCD enable.
    bit_offset: 0
    bit_size: 1
  - name: LCDCLK
    description: LCD scanning frequency selection. LCD frame rate = scanning frequency x DUTY.
    bit_offset: 1
    bit_size: 2
    enum: LCDCLK
  - name: BIAS
    description: LCD bias drive waveform selection.
    bit_offset: 5
    bit_size: 1
    enum: BIAS
  - name: DUTY
    description: LCD duty configuration.
    bit_offset: 6
    bit_size: 3
    enum: DUTY
  - name: BSEL
    description: BIAS voltage source selection.
    bit_offset: 9
    bit_size: 3
    enum: BSEL
  - name: CONTRAST
    description: "LCD contrast adjustment, valid only when an internal resistor divider is selected by BSEL. 0x0 gives maximum waveform amplitude and maximum contrast; 0xF gives minimum amplitude and minimum contrast."
    bit_offset: 12
    bit_size: 4
fieldset/CR1:
  description: Configuration register 1.
  fields:
  - name: BLINKCNT
    description: "Blink frequency and interrupt interval. Blink frequency = frame frequency / (BLINKCNT+1); interrupt interval = (BLINKCNT+1) / frame frequency."
    bit_offset: 0
    bit_size: 6
  - name: BLINKEN
    description: LCD blink enable.
    bit_offset: 6
    bit_size: 1
  - name: MODE
    description: LCD RAM display mode selection.
    bit_offset: 8
    bit_size: 1
    enum: MODE
  - name: IE
    description: LCD interrupt enable.
    bit_offset: 9
    bit_size: 1
  - name: DMAEN
    description: DMA hardware trigger enable, lets the LCD interrupt trigger DMA.
    bit_offset: 10
    bit_size: 1
  - name: INTF
    description: LCD interrupt flag. Cleared by writing 0 to INTCLR.INTF_CLR.
    bit_offset: 11
    bit_size: 1
    access: Read
fieldset/INTCLR:
  description: Interrupt clear register.
  fields:
  - name: INTF_CLR
    description: "Clears CR1.INTF. Write 0 to clear; writing 1 has no effect. Reset value is 1."
    bit_offset: 10
    bit_size: 1
fieldset/POEN0:
  description: Output configuration register 0.
  fields:
  - name: S
    description: "SEG0-31 output control. 0: SEG output enabled; 1: SEG output off, so the pin can be used for IO or analog functions."
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/POEN1:
  description: Output configuration register 1.
  fields:
  - name: S
    description: "SEG32-35 output control. 0: SEG output enabled; 1: SEG output off, so the pin can be used for IO or analog functions."
    bit_offset: 0
    bit_size: 1
    array:
      len: 4
      stride: 1
  - name: SXCY
    description: "SEG/COM shared pin output control for SEG36-39 / COM4-7, one bit each. 0: SEG/COM output enabled; 1: output off. Which pin each bit drives is set by CR0.DUTY."
    bit_offset: 4
    bit_size: 4
  - name: C
    description: "COM0-3 output control. 0: COM output enabled; 1: COM output off, so the pin can be used for IO or analog functions."
    bit_offset: 8
    bit_size: 1
    array:
      len: 4
      stride: 1
  - name: MUX
    description: "SEG32-35 port function selection. 0: pins act as SEG32-35; 1: pins act as IO or VLCD, per RM table 17-3."
    bit_offset: 12
    bit_size: 1
fieldset/RAM:
  description: Display RAM, full 32 bits.
  fields:
  - name: D
    description: "LCD dot output. 0: the corresponding SEG/COM intersection is not lit; 1: it is lit."
    bit_offset: 0
    bit_size: 32
fieldset/RAM8:
  description: Display RAM, only the low 8 bits are implemented.
  fields:
  - name: D
    description: "LCD dot output. 0: the corresponding SEG/COM intersection is not lit; 1: it is lit."
    bit_offset: 0
    bit_size: 8
enum/LCDCLK:
  bit_size: 2
  variants:
  - name: HZ64
    description: 64 Hz scanning frequency
    value: 0
  - name: HZ128
    description: 128 Hz scanning frequency
    value: 1
  - name: HZ256
    description: 256 Hz scanning frequency
    value: 2
  - name: HZ512
    description: 512 Hz scanning frequency
    value: 3
enum/BIAS:
  bit_size: 1
  variants:
  - name: BIAS1_3
    description: 1/3 bias
    value: 0
  - name: BIAS1_2
    description: 1/2 bias
    value: 1
enum/DUTY:
  bit_size: 3
  variants:
  - name: STATIC
    description: Static
    value: 0
  - name: DUTY1_2
    description: 1/2 duty
    value: 1
  - name: DUTY1_3
    description: 1/3 duty
    value: 2
  - name: DUTY1_4
    description: 1/4 duty
    value: 3
  - name: DUTY1_6
    description: 1/6 duty
    value: 5
  - name: DUTY1_8
    description: 1/8 duty
    value: 7
enum/BSEL:
  bit_size: 3
  variants:
  - name: EXTERNAL_RESISTOR
    description: External resistor mode, requires external circuitry
    value: 0
  - name: INTERNAL_MID_POWER
    description: Internal resistor divider, mid-power mode
    value: 2
  - name: INTERNAL_LOW_POWER
    description: Internal resistor divider, low power consumption mode
    value: 4
  - name: INTERNAL_HIGH_POWER
    description: Internal resistor divider, high power mode
    value: 6
enum/MODE:
  bit_size: 1
  variants:
  - name: MODE0
    description: Mode 0
    value: 0
  - name: MODE1
    description: Mode 1
    value: 1
